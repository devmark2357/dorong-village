name: outfit-worker
# 「나만의 캐릭터 꾸미기」: draws finished outfit sheets into the game atlas. No secrets: the edge function checks this job's OIDC token.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/outfit.yml']
permissions:
  id-token: write
  contents: read
concurrency:
  group: outfit-worker
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - run: python worker/worker.py
