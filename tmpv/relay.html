<!doctype html><meta charset=utf-8><title>relay</title><body>relay
<script>
(async()=>{const q=new URLSearchParams(location.search);const files=(q.get('f')||'').split(',').filter(Boolean);const out=[];
for(const f of files){const r=await fetch(f);const b=await r.arrayBuffer();out.push({name:f.split('/').pop(),type:r.headers.get('content-type')||'',buf:b});document.body.append(' '+f);}
(window.opener||window.parent).postMessage({relay:out},'*',out.map(o=>o.buf));document.body.append(' sent');})();
</script>
